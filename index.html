<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>verysense AI — Coming soon</title>
<meta name="description" content="verysense AI is getting ready to launch. Coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EEF1F4;
    --ink: #14213D;
    --muted: #5B6B82;
    --dot: #B8C3D1;
    --signal: #2F5BFF;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E1626;
      --ink: #E6ECF4;
      --muted: #8D9BB0;
      --dot: #26344C;
      --signal: #6E8BFF;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1626;
    --ink: #E6ECF4;
    --muted: #8D9BB0;
    --dot: #26344C;
    --signal: #6E8BFF;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", system-ui, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  canvas#field {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  main {
    position: relative;
    z-index: 1;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: clamp(24px, 6vw, 80px);
    pointer-events: none;
  }

  .mark {
    font-family: "Inter Tight", "Inter", system-ui, sans-serif;
    font-weight: 600;
    font-size: clamp(3rem, 12vw, 10rem);
    line-height: 0.95;
    letter-spacing: -0.035em;
    white-space: nowrap;
  }
  .mark .ai {
    color: var(--signal);
  }

  .status {
    margin-top: clamp(20px, 3vw, 36px);
    max-width: 36ch;
  }
  .status h1 {
    font-family: "Inter Tight", "Inter", system-ui, sans-serif;
    font-weight: 500;
    font-size: clamp(1.4rem, 2.6vw, 2rem);
    letter-spacing: -0.01em;
  }
  .status p {
    margin-top: 8px;
    font-size: clamp(1rem, 1.4vw, 1.125rem);
    line-height: 1.5;
    color: var(--muted);
  }

  footer {
    position: fixed;
    right: clamp(16px, 6vw, 80px);
    bottom: clamp(16px, 3vw, 32px);
    z-index: 1;
    font-size: 0.875rem;
    color: var(--muted);
  }

  @media (max-width: 600px) {
    main { padding: 24px 16px 72px; }
    footer { left: 16px; right: auto; }
  }
</style>
</head>
<body>
  <canvas id="field" aria-hidden="true"></canvas>

  <main>
    <div class="mark" aria-label="verysense AI">
      verysense <span class="ai">AI</span>
    </div>
    <div class="status">
      <h1>Coming soon.</h1>
      <p>We're getting ready to launch. Check back shortly.</p>
    </div>
  </main>

  <footer>© <span id="year">2026</span> verysense AI</footer>

<script>
(function () {
  document.getElementById('year').textContent = new Date().getFullYear();

  const canvas = document.getElementById('field');
  const ctx = canvas.getContext('2d');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');

  const GAP = 26;          // spacing between dots
  const BASE = 1.3;        // resting dot radius
  const BOOST = 3.2;       // extra radius when lit
  const RANGE = 170;       // how far the pointer "sensing" reaches

  const SPEED = 420;       // pulse speed, px per second
  const PAUSE = 2;         // seconds to wait after a pulse finishes before the next one
  const WIDTH = 70;        // thickness of the ring, px (same as the original ripple)
  const MIN_GLOW = 0.15;   // brightness where the pulse starts
  const MAX_GLOW = 0.95;   // brightness when it reaches the far corner

  let w, h, dpr, cols, rows, ox, oy;
  let reach = 1;           // distance the pulse travels before it finishes
  let dotColor, signalColor;
  const pointer = { x: -9999, y: -9999, tx: -9999, ty: -9999 };
  let cycleStart = null;   // when the current pulse cycle began (seconds)

  function readColors() {
    const s = getComputedStyle(document.documentElement);
    dotColor = hexToRgb(s.getPropertyValue('--dot').trim());
    signalColor = hexToRgb(s.getPropertyValue('--signal').trim());
  }

  function hexToRgb(hex) {
    const n = parseInt(hex.replace('#', ''), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  function measureReach() {
    // same path as the original ripple: from the bottom-left corner until fully off-screen
    reach = Math.hypot(w, h) + 140;
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cols = Math.ceil(w / GAP) + 1;
    rows = Math.ceil(h / GAP) + 1;
    ox = (w % GAP) / 2;
    oy = (h % GAP) / 2;
    measureReach();
    draw(performance.now() / 1000);
  }

  function draw(now) {
    ctx.clearRect(0, 0, w, h);
    let rad = -1;
    if (cycleStart !== null) {
      const travel = reach / SPEED;
      const elapsed = (now - cycleStart) % (travel + PAUSE);
      if (elapsed < travel) rad = elapsed * SPEED;
    }
    const glow = rad >= 0 ? MIN_GLOW + (MAX_GLOW - MIN_GLOW) * Math.min(1, rad / reach) : 0;
    const c0 = dotColor, c1 = signalColor;

    for (let i = 0; i < cols; i++) {
      for (let j = 0; j < rows; j++) {
        const x = ox + i * GAP;
        const y = oy + j * GAP;

        // pointer glow
        const dp = Math.hypot(x - pointer.x, y - pointer.y);
        let t = Math.max(0, 1 - dp / RANGE);
        t = t * t;

        // pulse ring from the bottom-left corner, brighter as it expands
        if (rad >= 0) {
          const off = Math.abs(Math.hypot(x, y - h) - rad);
          if (off < WIDTH) {
            const ring = (1 - off / WIDTH) * glow;
            if (ring > t) t = ring;
          }
        }

        const r = BASE + BOOST * t;
        const cr = Math.round(c0[0] + (c1[0] - c0[0]) * t);
        const cg = Math.round(c0[1] + (c1[1] - c0[1]) * t);
        const cb = Math.round(c0[2] + (c1[2] - c0[2]) * t);
        ctx.fillStyle = `rgb(${cr},${cg},${cb})`;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function tick(ms) {
    const now = ms / 1000;
    pointer.x += (pointer.tx - pointer.x) * 0.15;
    pointer.y += (pointer.ty - pointer.y) * 0.15;

    if (cycleStart === null) cycleStart = now;

    draw(now);
    requestAnimationFrame(tick);
  }

  function setPointer(x, y) {
    pointer.tx = x; pointer.ty = y;
    if (pointer.x < -9000) { pointer.x = x; pointer.y = y; }
    if (reduce.matches) { pointer.x = x; pointer.y = y; draw(performance.now() / 1000); }
  }

  window.addEventListener('pointermove', e => setPointer(e.clientX, e.clientY));
  window.addEventListener('pointerdown', e => setPointer(e.clientX, e.clientY));
  document.addEventListener('pointerleave', () => {
    pointer.tx = pointer.ty = pointer.x = pointer.y = -9999;
    if (reduce.matches) draw(performance.now() / 1000);
  });
  window.addEventListener('resize', resize);
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readColors(); draw(performance.now() / 1000); });

  readColors();
  resize();

  // repeating pulse (static dots if the visitor prefers reduced motion)
  if (!reduce.matches) requestAnimationFrame(tick);
})();
</script>
</body>
</html>
