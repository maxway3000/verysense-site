<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>verysense AI — Coming soon</title>
<meta name="description" content="verysense AI is getting ready to launch. Coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EEF1F4;
    --ink: #14213D;
    --muted: #5B6B82;
    --dot: #B8C3D1;
    --signal: #2F5BFF;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E1626;
      --ink: #E6ECF4;
      --muted: #8D9BB0;
      --dot: #26344C;
      --signal: #6E8BFF;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1626;
    --ink: #E6ECF4;
    --muted: #8D9BB0;
    --dot: #26344C;
    --signal: #6E8BFF;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", system-ui, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  canvas#field {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  main {
    position: relative;
    z-index: 1;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: clamp(24px, 6vw, 80px);
    pointer-events: none;
  }

  .mark {
    font-family: "Inter Tight", "Inter", system-ui, sans-serif;
    font-weight: 600;
    font-size: clamp(3rem, 12vw, 10rem);
    line-height: 0.95;
    letter-spacing: -0.035em;
    white-space: nowrap;
  }
  .mark .ai {
    color: var(--signal);
  }

  .status {
    margin-top: clamp(20px, 3vw, 36px);
    max-width: 36ch;
  }
  .status h1 {
    font-family: "Inter Tight", "Inter", system-ui, sans-serif;
    font-weight: 500;
    font-size: clamp(1.4rem, 2.6vw, 2rem);
    letter-spacing: -0.01em;
  }
  .status p {
    margin-top: 8px;
    font-size: clamp(1rem, 1.4vw, 1.125rem);
    line-height: 1.5;
    color: var(--muted);
  }

  footer {
    position: fixed;
    right: clamp(16px, 6vw, 80px);
    bottom: clamp(16px, 3vw, 32px);
    z-index: 1;
    font-size: 0.875rem;
    color: var(--muted);
  }

  @media (max-width: 600px) {
    main { padding: 24px 16px 72px; }
    footer { left: 16px; right: auto; }
  }
</style>
</head>
<body>
  <canvas id="field" aria-hidden="true"></canvas>

  <main>
    <div class="mark" aria-label="verysense AI">
      verysense <span class="ai">AI</span>
    </div>
    <div class="status">
      <h1>Coming soon.</h1>
      <p>We're getting ready to launch. Check back shortly.</p>
    </div>
  </main>

  <footer>© <span id="year">2026</span> verysense AI</footer>

<script>
(function () {
  document.getElementById('year').textContent = new Date().getFullYear();

  const canvas = document.getElementById('field');
  const ctx = canvas.getContext('2d');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');

  const GAP = 26;          // spacing between dots
  const BASE = 1.3;        // resting dot radius
  const BOOST = 3.2;       // extra radius near the pointer
  const RANGE = 170;       // how far the "sensing" reaches

  let w, h, dpr, cols, rows;
  let dotColor, signalColor;
  const pointer = { x: -9999, y: -9999, tx: -9999, ty: -9999 };
  let pulse = 0;           // load ripple radius
  let running = false;

  function readColors() {
    const s = getComputedStyle(document.documentElement);
    dotColor = hexToRgb(s.getPropertyValue('--dot').trim());
    signalColor = hexToRgb(s.getPropertyValue('--signal').trim());
  }

  function hexToRgb(hex) {
    const n = parseInt(hex.replace('#', ''), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cols = Math.ceil(w / GAP) + 1;
    rows = Math.ceil(h / GAP) + 1;
    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);
    const ox = (w % GAP) / 2;
    const oy = (h % GAP) / 2;
    const maxR = Math.hypot(w, h);

    for (let i = 0; i < cols; i++) {
      for (let j = 0; j < rows; j++) {
        const x = ox + i * GAP;
        const y = oy + j * GAP;

        // closeness to pointer (0..1)
        const d = Math.hypot(x - pointer.x, y - pointer.y);
        let t = Math.max(0, 1 - d / RANGE);
        t = t * t;

        // load ripple: a thin ring travelling outward from bottom-left
        if (pulse > 0 && pulse < maxR + 120) {
          const pd = Math.abs(Math.hypot(x, y - h) - pulse);
          const ring = Math.max(0, 1 - pd / 70) * 0.8;
          if (ring > t) t = ring;
        }

        const r = BASE + BOOST * t;
        const c0 = dotColor, c1 = signalColor;
        const cr = Math.round(c0[0] + (c1[0] - c0[0]) * t);
        const cg = Math.round(c0[1] + (c1[1] - c0[1]) * t);
        const cb = Math.round(c0[2] + (c1[2] - c0[2]) * t);
        ctx.fillStyle = `rgb(${cr},${cg},${cb})`;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function tick() {
    pointer.x += (pointer.tx - pointer.x) * 0.15;
    pointer.y += (pointer.ty - pointer.y) * 0.15;
    if (pulse > 0) pulse += 14;
    if (pulse > Math.hypot(w, h) + 140) pulse = 0;
    draw();

    const settled = Math.abs(pointer.tx - pointer.x) < 0.5 &&
                    Math.abs(pointer.ty - pointer.y) < 0.5 && pulse === 0;
    if (settled) { running = false; return; }
    requestAnimationFrame(tick);
  }

  function start() {
    if (reduce.matches) { pointer.x = pointer.tx; pointer.y = pointer.ty; pulse = 0; draw(); return; }
    if (!running) { running = true; requestAnimationFrame(tick); }
  }

  function setPointer(x, y) {
    pointer.tx = x; pointer.ty = y;
    if (pointer.x < -9000) { pointer.x = x; pointer.y = y; }
    start();
  }

  window.addEventListener('pointermove', e => setPointer(e.clientX, e.clientY));
  window.addEventListener('pointerdown', e => setPointer(e.clientX, e.clientY));
  document.addEventListener('pointerleave', () => { pointer.tx = -9999; pointer.ty = -9999; pointer.x = -9999; pointer.y = -9999; start(); });
  window.addEventListener('resize', resize);
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readColors(); draw(); });

  readColors();
  resize();

  // single ripple on load
  if (!reduce.matches) { pulse = 1; start(); }
})();
</script>
</body>
</html>
